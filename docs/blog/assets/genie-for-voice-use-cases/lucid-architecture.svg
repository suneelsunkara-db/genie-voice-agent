<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Genie Voice Lucid-style Architecture Diagram</title>
  <desc id="desc">Layered architecture showing voice capture, FastAPI assist API, Lakebase live serving, Foundation Model enrichment, Genie validation, and Unity Catalog analytics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f6f9f"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; filter: url(#shadow); }
      .zone-title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node { fill: #f8fbff; stroke: #7aa2e3; stroke-width: 2; }
      .node-alt { fill: #fffaf0; stroke: #e0a933; stroke-width: 2; }
      .node-green { fill: #f0fdf4; stroke: #22a06b; stroke-width: 2; }
      .label { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; }
      .arrow { stroke: #4f6f9f; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .muted-arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="820"/>

  <rect class="zone" x="60" y="70" width="280" height="640" rx="26"/>
  <text class="zone-title" x="90" y="115">Agent Cockpit</text>
  <rect class="node" x="90" y="155" width="220" height="74" rx="16"/>
  <text class="label" x="115" y="187">Customers with Issues</text>
  <text class="sub" x="115" y="210">Priority queue</text>
  <rect class="node" x="90" y="250" width="220" height="74" rx="16"/>
  <text class="label" x="115" y="282">Conversation Stream</text>
  <text class="sub" x="115" y="305">Live mic / transcript</text>
  <rect class="node" x="90" y="345" width="220" height="74" rx="16"/>
  <text class="label" x="115" y="377">Resolution Journey</text>
  <text class="sub" x="115" y="400">Open to closed stages</text>
  <rect class="node" x="90" y="440" width="220" height="74" rx="16"/>
  <text class="label" x="115" y="472">Account Facts</text>
  <text class="sub" x="115" y="495">Invoices and risk</text>
  <rect class="node" x="90" y="535" width="220" height="74" rx="16"/>
  <text class="label" x="115" y="567">Ask Genie Panel</text>
  <text class="sub" x="115" y="590">Portfolio Q&amp;A</text>

  <rect class="zone" x="410" y="130" width="300" height="520" rx="26"/>
  <text class="zone-title" x="445" y="175">Assist API</text>
  <rect class="node-alt" x="450" y="220" width="220" height="86" rx="16"/>
  <text class="label" x="485" y="254">FastAPI Routes</text>
  <text class="sub" x="485" y="278">GET/POST /assist</text>
  <rect class="node-alt" x="450" y="340" width="220" height="86" rx="16"/>
  <text class="label" x="485" y="374">Mic Stream WS</text>
  <text class="sub" x="485" y="398">STT to assist flow</text>
  <rect class="node-alt" x="450" y="460" width="220" height="86" rx="16"/>
  <text class="label" x="485" y="494">Resolution + Billing</text>
  <text class="sub" x="485" y="518">State machine commit</text>

  <rect class="zone" x="780" y="70" width="250" height="640" rx="26"/>
  <text class="zone-title" x="815" y="115">Inference Layer</text>
  <rect class="node-green" x="815" y="170" width="180" height="88" rx="18"/>
  <text class="label" x="855" y="205">STT Provider</text>
  <text class="sub" x="835" y="230">Final utterances</text>
  <rect class="node-green" x="815" y="305" width="180" height="88" rx="18"/>
  <text class="label" x="845" y="340">Foundation Model</text>
  <text class="sub" x="835" y="365">Per customer turn</text>
  <rect class="node-green" x="815" y="440" width="180" height="88" rx="18"/>
  <text class="label" x="860" y="475">Genie</text>
  <text class="sub" x="828" y="500">Validate + analyze</text>

  <rect class="zone" x="1100" y="95" width="240" height="590" rx="26"/>
  <text class="zone-title" x="1132" y="140">Data and Trust</text>
  <rect class="node" x="1135" y="185" width="170" height="76" rx="15"/>
  <text class="label" x="1178" y="217">Lakebase</text>
  <text class="sub" x="1160" y="240">Live assist state</text>
  <rect class="node" x="1135" y="295" width="170" height="76" rx="15"/>
  <text class="label" x="1168" y="327">Unity Catalog</text>
  <text class="sub" x="1158" y="350">Reference + gold</text>
  <rect class="node" x="1135" y="405" width="170" height="76" rx="15"/>
  <text class="label" x="1170" y="437">CDF History</text>
  <text class="sub" x="1155" y="460">Call to analytics</text>
  <rect class="node" x="1135" y="515" width="170" height="76" rx="15"/>
  <text class="label" x="1168" y="547">Genie Space</text>
  <text class="sub" x="1155" y="570">Portfolio NL to SQL</text>

  <path class="arrow" d="M310 360 L410 360"/>
  <path class="arrow" d="M670 300 L780 250"/>
  <path class="arrow" d="M670 430 L780 350"/>
  <path class="arrow" d="M995 350 L1100 320"/>
  <path class="muted-arrow" d="M1220 260 L1220 120 L350 120 L350 155"/>
  <path class="muted-arrow" d="M995 480 L1050 480 L1050 620 L1220 620 L1220 590"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Speech recognition accuracy across 24 languages</title>
  <desc id="desc">Vertical bar chart showing how accurately the voice agent understands speech in each of 24 languages, tested on the FLEURS dataset. Higher bars mean better recognition. Japanese, English, Spanish, Malay, and Arabic perform best at 81 to 83 percent.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #94a3b8; stroke-width: 1.5; }
      .ylabel { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .bar-word { fill: #3b6fb0; }
      .bar-char { fill: #1f9e89; }
      .val { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .lang { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .legend { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .foot { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="620"/>

  <text class="title" x="60" y="40">Speech recognition accuracy across 24 languages</text>
  <text class="subtitle" x="60" y="64">How much the agent correctly understood, tested on FLEURS. Higher is better.</text>

  <!-- legend -->
  <rect x="1060" y="30" width="16" height="16" rx="3" class="bar-word"/>
  <text class="legend" x="1082" y="43">Word accuracy</text>
  <rect x="1220" y="30" width="16" height="16" rx="3" class="bar-char"/>
  <text class="legend" x="1242" y="43">Character accuracy</text>

  <!-- gridlines (0 to 100%) -->
  <line class="grid" x1="100" y1="520" x2="1360" y2="520"/>
  <line class="grid" x1="100" y1="434" x2="1360" y2="434"/>
  <line class="grid" x1="100" y1="348" x2="1360" y2="348"/>
  <line class="grid" x1="100" y1="262" x2="1360" y2="262"/>
  <line class="grid" x1="100" y1="176" x2="1360" y2="176"/>
  <line class="grid" x1="100" y1="90" x2="1360" y2="90"/>
  <text class="ylabel" x="90" y="524" text-anchor="end">0%</text>
  <text class="ylabel" x="90" y="438" text-anchor="end">20%</text>
  <text class="ylabel" x="90" y="352" text-anchor="end">40%</text>
  <text class="ylabel" x="90" y="266" text-anchor="end">60%</text>
  <text class="ylabel" x="90" y="180" text-anchor="end">80%</text>
  <text class="ylabel" x="90" y="94" text-anchor="end">100%</text>
  <line class="axis" x1="100" y1="90" x2="100" y2="520"/>

  <!-- bars: sorted descending by accuracy (best first) -->
  <!-- ja 83% (char) -->
  <rect class="bar-char" x="109" y="162" width="34" height="358" rx="3"/>
  <text class="val" x="126" y="156" text-anchor="middle">83%</text>
  <text class="lang" x="126" y="540" text-anchor="middle">ja</text>
  <!-- en 83% (word) -->
  <rect class="bar-word" x="161" y="165" width="34" height="355" rx="3"/>
  <text class="val" x="178" y="159" text-anchor="middle">83%</text>
  <text class="lang" x="178" y="540" text-anchor="middle">en</text>
  <!-- es 82% (word) -->
  <rect class="bar-word" x="213" y="166" width="34" height="354" rx="3"/>
  <text class="val" x="230" y="160" text-anchor="middle">82%</text>
  <text class="lang" x="230" y="540" text-anchor="middle">es</text>
  <!-- ms 82% (word) -->
  <rect class="bar-word" x="265" y="167" width="34" height="353" rx="3"/>
  <text class="val" x="282" y="161" text-anchor="middle">82%</text>
  <text class="lang" x="282" y="540" text-anchor="middle">ms</text>
  <!-- ar 81% (word) -->
  <rect class="bar-word" x="317" y="173" width="34" height="347" rx="3"/>
  <text class="val" x="334" y="167" text-anchor="middle">81%</text>
  <text class="lang" x="334" y="540" text-anchor="middle">ar</text>
  <!-- nl 77% (word) -->
  <rect class="bar-word" x="369" y="189" width="34" height="331" rx="3"/>
  <text class="val" x="386" y="183" text-anchor="middle">77%</text>
  <text class="lang" x="386" y="540" text-anchor="middle">nl</text>
  <!-- tr 74% (word) -->
  <rect class="bar-word" x="421" y="201" width="34" height="319" rx="3"/>
  <text class="val" x="438" y="195" text-anchor="middle">74%</text>
  <text class="lang" x="438" y="540" text-anchor="middle">tr</text>
  <!-- th 74% (char) -->
  <rect class="bar-char" x="473" y="201" width="34" height="319" rx="3"/>
  <text class="val" x="490" y="195" text-anchor="middle">74%</text>
  <text class="lang" x="490" y="540" text-anchor="middle">th</text>
  <!-- id 72% (word) -->
  <rect class="bar-word" x="525" y="213" width="34" height="307" rx="3"/>
  <text class="val" x="542" y="207" text-anchor="middle">72%</text>
  <text class="lang" x="542" y="540" text-anchor="middle">id</text>
  <!-- fr 71% (word) -->
  <rect class="bar-word" x="577" y="216" width="34" height="304" rx="3"/>
  <text class="val" x="594" y="210" text-anchor="middle">71%</text>
  <text class="lang" x="594" y="540" text-anchor="middle">fr</text>
  <!-- ko 69% (word) -->
  <rect class="bar-word" x="629" y="222" width="34" height="298" rx="3"/>
  <text class="val" x="646" y="216" text-anchor="middle">69%</text>
  <text class="lang" x="646" y="540" text-anchor="middle">ko</text>
  <!-- ru 68% (word) -->
  <rect class="bar-word" x="681" y="229" width="34" height="291" rx="3"/>
  <text class="val" x="698" y="223" text-anchor="middle">68%</text>
  <text class="lang" x="698" y="540" text-anchor="middle">ru</text>
  <!-- it 67% (word) -->
  <rect class="bar-word" x="733" y="232" width="34" height="288" rx="3"/>
  <text class="val" x="750" y="226" text-anchor="middle">67%</text>
  <text class="lang" x="750" y="540" text-anchor="middle">it</text>
  <!-- zh 67% (char) -->
  <rect class="bar-char" x="785" y="233" width="34" height="287" rx="3"/>
  <text class="val" x="802" y="227" text-anchor="middle">67%</text>
  <text class="lang" x="802" y="540" text-anchor="middle">zh</text>
  <!-- pl 66% (word) -->
  <rect class="bar-word" x="837" y="237" width="34" height="283" rx="3"/>
  <text class="val" x="854" y="231" text-anchor="middle">66%</text>
  <text class="lang" x="854" y="540" text-anchor="middle">pl</text>
  <!-- de 64% (word) -->
  <rect class="bar-word" x="889" y="243" width="34" height="277" rx="3"/>
  <text class="val" x="906" y="237" text-anchor="middle">64%</text>
  <text class="lang" x="906" y="540" text-anchor="middle">de</text>
  <!-- el 62% (word) -->
  <rect class="bar-word" x="941" y="254" width="34" height="266" rx="3"/>
  <text class="val" x="958" y="248" text-anchor="middle">62%</text>
  <text class="lang" x="958" y="540" text-anchor="middle">el</text>
  <!-- sv 59% (word) -->
  <rect class="bar-word" x="993" y="265" width="34" height="255" rx="3"/>
  <text class="val" x="1010" y="259" text-anchor="middle">59%</text>
  <text class="lang" x="1010" y="540" text-anchor="middle">sv</text>
  <!-- hi 56% (word) -->
  <rect class="bar-word" x="1045" y="278" width="34" height="242" rx="3"/>
  <text class="val" x="1062" y="272" text-anchor="middle">56%</text>
  <text class="lang" x="1062" y="540" text-anchor="middle">hi</text>
  <!-- pt 56% (word) -->
  <rect class="bar-word" x="1097" y="280" width="34" height="240" rx="3"/>
  <text class="val" x="1114" y="274" text-anchor="middle">56%</text>
  <text class="lang" x="1114" y="540" text-anchor="middle">pt</text>
  <!-- fi 53% (word) -->
  <rect class="bar-word" x="1149" y="291" width="34" height="229" rx="3"/>
  <text class="val" x="1166" y="285" text-anchor="middle">53%</text>
  <text class="lang" x="1166" y="540" text-anchor="middle">fi</text>
  <!-- da 48% (word) -->
  <rect class="bar-word" x="1201" y="313" width="34" height="207" rx="3"/>
  <text class="val" x="1218" y="307" text-anchor="middle">48%</text>
  <text class="lang" x="1218" y="540" text-anchor="middle">da</text>
  <!-- fil 33% (word) -->
  <rect class="bar-word" x="1253" y="378" width="34" height="142" rx="3"/>
  <text class="val" x="1270" y="372" text-anchor="middle">33%</text>
  <text class="lang" x="1270" y="540" text-anchor="middle">fil</text>
  <!-- vi 30% (word) -->
  <rect class="bar-word" x="1305" y="390" width="34" height="130" rx="3"/>
  <text class="val" x="1322" y="384" text-anchor="middle">30%</text>
  <text class="lang" x="1322" y="540" text-anchor="middle">vi</text>

  <text class="foot" x="60" y="580">Tested on FLEURS (google/fleurs), 20 samples per language. Character accuracy used for Chinese, Japanese, and Thai where words are not space-separated.</text>
  <text class="foot" x="60" y="598">Run: 2026-07-26. Measured through the full voice API, not the speech model in isolation.</text>
</svg>

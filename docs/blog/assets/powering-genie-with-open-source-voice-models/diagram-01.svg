<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
  <title id="title">A live customer-to-agent voice conversation over the realtime API</title>
  <desc id="desc">A customer speaks and listens in their own language. Audio streams both ways over the Realtime Voice API (WebSocket, streaming turns, barge-in). Inside a turn, Qwen3-ASR listens and detects the language, Qwen3-Next reasons and calls tools, and VoxCPM2 speaks the reply in the same language. Qwen3-Next reaches Databricks Genie for grounded answers over governed data.</desc>
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4f6f9f"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .zone { fill: #eef4ff; stroke: #9cc0f0; stroke-width: 2; stroke-dasharray: 7 5; }
      .zlbl { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f4e8f; }
      .node { fill: #ffffff; stroke: #7aa2e3; stroke-width: 2; filter: url(#s); }
      .cust { fill: #f8fbff; stroke: #5f6b7a; stroke-width: 2; filter: url(#s); }
      .orch { fill: #eaf1ff; stroke: #1f6feb; stroke-width: 2.5; filter: url(#s); }
      .genie { fill: #fff7ed; stroke: #e0a933; stroke-width: 2.5; filter: url(#s); }
      .lbl { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .sub { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6b7a; }
      .cap { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4f6f9f; }
      .arw { stroke: #4f6f9f; stroke-width: 2.5; fill: none; marker-end: url(#arw); }
    </style>
  </defs>
  <rect class="bg" width="1040" height="540"/>

  <!-- Customer -->
  <rect class="cust" x="30" y="150" width="160" height="112" rx="16"/>
  <text class="lbl" x="52" y="196">Customer</text>
  <text class="sub" x="52" y="221">speaks &amp; listens</text>
  <text class="sub" x="52" y="241">any language</text>

  <!-- Realtime API zone -->
  <rect class="zone" x="300" y="112" width="712" height="178" rx="20"/>
  <text class="zlbl" x="324" y="139">Realtime Voice API  ·  streaming turns · barge-in</text>

  <rect class="node" x="324" y="158" width="196" height="104" rx="15"/>
  <text class="lbl" x="346" y="205">Qwen3-ASR</text>
  <text class="sub" x="346" y="230">listen · detect language</text>

  <rect class="orch" x="546" y="158" width="196" height="104" rx="15"/>
  <text class="lbl" x="568" y="205">Qwen3-Next</text>
  <text class="sub" x="568" y="230">reason · call tools</text>

  <rect class="node" x="768" y="158" width="196" height="104" rx="15"/>
  <text class="lbl" x="790" y="205">VoxCPM2</text>
  <text class="sub" x="790" y="230">speak · same language</text>

  <!-- Genie tool -->
  <rect class="genie" x="548" y="392" width="212" height="104" rx="16"/>
  <text class="lbl" x="570" y="439">Databricks Genie</text>
  <text class="sub" x="570" y="464">grounded answers · governed data</text>

  <!-- conversation: two-way streaming audio between customer and API -->
  <text class="cap" x="198" y="172">live audio · WebSocket</text>
  <path class="arw" d="M192 192 L300 192"/>
  <path class="arw" d="M300 224 L192 224"/>

  <!-- inside a turn -->
  <path class="arw" d="M520 210 L546 210"/>
  <path class="arw" d="M742 210 L768 210"/>

  <!-- Qwen3-Next reaches Genie and back -->
  <text class="cap" x="672" y="335">analytical Q&amp;A</text>
  <path class="arw" d="M628 262 L628 392"/>
  <path class="arw" d="M664 392 L664 262"/>
</svg>

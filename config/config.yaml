# =============================================================================
# Genie Voice Agent - configuration.
#
# This file is the SINGLE SOURCE OF TRUTH for the Databricks App: it holds the
# real deployed values and is the only config file synced to the app. No env
# overrides are used by the app (secrets are the sole exception - see below).
#
# Local development: gitignored config/config.local.yaml is deep-merged OVER this
# file (local values win), so it flips deployment/auth/providers/profile back to
# your machine's values and supplies API keys. Nothing here needs env vars.
#
# Secrets: NEVER commit real keys here. Locally they live in config.local.yaml;
# on the app they are injected from a Databricks secret scope (valueFrom).
# =============================================================================

# Deployment target - the ONLY run switch. It selects who PRODUCES live/mock data:
#   local = synthetic producer (genie_voice.datagen) generates vendor-shaped
#           Deepgram/ElevenLabs payloads + reference records (no vendor API calls).
#   live  = real Deepgram/ElevenLabs capture produces the payloads.
# The app runs `live`; config.local.yaml overrides this to `local` for dev.
deployment: live

databricks:
  # Workspace URL. On the app this is also platform-injected as DATABRICKS_HOST.
  host: "https://fe-vm-vdm-classic-rcn6ip.cloud.databricks.com"
  # `default` = SDK unified-auth credential chain, which works in EVERY context
  # with no env config: the app picks up its injected service-principal creds
  # (DATABRICKS_CLIENT_ID/SECRET/HOST), serverless jobs use the ambient job
  # identity, and local dev uses the profile below. (Do NOT set `oauth` here:
  # that path needs CLIENT_ID/SECRET which serverless jobs don't have.)
  auth_type: default        # default | pat | oauth
  # ~/.databrickscfg profile. Empty on the app/jobs (ambient/SP auth is used);
  # config.local.yaml sets the real profile for local dev.
  profile: ""
  # Identity used for GRANTs/Lakebase role. Empty -> the caller's OAuth identity:
  # the app's service principal on Databricks Apps. Local dev sets a real email.
  run_as: ""
  catalog: partner_demo_catalog         # existing catalog (not created by us)
  create_catalog: false     # never CREATE CATALOG; we use an existing one
  schema: genie_voice_contact_center        # our schema inside the catalog
  sql_warehouse_id: "d0a0a25efd015c58"      # REQUIRED: bootstrap / table load / Genie / benchmark Delta reads
  # Genie space is created/resolved dynamically by NAME (no hardcoded id).
  genie_space_name: "Genie Voice - Contact Center"

# Unity Catalog Volumes for raw landing.
volume:
  batch_name: raw_batch_data
  streaming_name: raw_streaming_data
  # Path templates resolved at runtime with catalog/schema/batch_volume/streaming_volume.
  reference_path: "/Volumes/{catalog}/{schema}/{batch_volume}/reference"
  raw_stt_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/call_streaming_data/raw_stt"
  call_facts_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/call_streaming_data/call_facts"
  audio_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/call_streaming_data/audio"
  transcript_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/call_streaming_data/transcripts"
  checkpoint_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/_pipeline_state" # Auto Loader checkpoints/schema (OUTSIDE raw_stt)
  # Multilingual voice benchmark outputs (summary.json, issues.jsonl, optional per-lang rows).
  multilingual_voice_benchmark_path: "/Volumes/{catalog}/{schema}/{streaming_volume}/multilingual_voice_benchmark"

# UC analytics tables (created in {catalog}.{schema}). Lakebase is the source
# and serving store; job tasks derive governed analytics from Lakebase CDF history
# plus the streaming transcript path.
medallion:
  gold_call_insights: gold_call_insights               # NLP insights per call

# Lakebase autoscaling project (low-latency serving for agent assist).
lakebase:
  enabled: true                     # use real Lakebase (offline deploy overrides to false)
  instance: genie_voice_lakebase    # Lakebase database instance name
  database: databricks_postgres     # Postgres database inside the instance
  port: 5432                        # Postgres port for the compute endpoint
  schema: genie_voice_contact_center # Postgres schema for low-latency serving tables
  capacity: CU_1                    # autoscaling capacity unit
  # With U2M we MINT a short-lived Postgres OAuth token at runtime (no stored password).
  serving_table: call_state         # live state served to agents
  live_utterances_table: live_call_utterances # live transcript turns for CDF back to UC
  # Lakebase CDF is started in the UI. The orchestration job gates UC analytics /
  # Genie until wal2delta.tables reports sync running and UC history tables exist.
  cdf_required: true
  cdf_history_prefix: "lb_"
  cdf_history_suffix: "_history"
  cdf_wait_timeout_seconds: 600
  cdf_poll_seconds: 15
  cdf_required_tables:
    - call_facts
    - live_call_utterances
    - billing_adjustments
    - call_state
    - resolution_events
  # Lakebase-native operational call tables loaded under lakebase.schema using
  # primary names. Customer/billing reference tables stay in UC Delta only.
  sync_tables:
    - call_facts
    - live_call_utterances

# Swappable external providers - fully vendor-agnostic.
#   adapters: logical name -> "module.path:ClassName" (loaded dynamically; the
#             core code never imports a vendor). Add a vendor by dropping in an
#             adapter file and adding a line here. No core code changes.
#   active:   which adapter to use.
#   options:  per-adapter settings block.
# `deployment` (top-level) controls mock vs live vendor transport.
providers:
  stt:
    adapters:
      deepgram: "genie_voice.providers.stt.deepgram:DeepgramSTT"
      databricks: "genie_voice.providers.stt.databricks:DatabricksSTT"
      # assemblyai: "genie_voice.providers.stt.assemblyai:AssemblyAISTT"
      # azure:      "genie_voice.providers.stt.azure:AzureSTT"
    # The app uses the Databricks ASR endpoints; config.local.yaml overrides this
    # to `deepgram` for local dev.
    active: databricks
    options:
      deepgram:
        model: nova-3
        language: en-US
        diarize: true
        multichannel: true        # dual-channel telephony => channel == speaker
        smart_format: true
        # Feature flag: normalize invoice-like ASR spans with invoice IDs from
        # the active account context. Keeps raw_transcript in API responses.
        postprocess_invoice_ids: false
        redact: [pci, ssn, numbers]
        endpointing_ms: 10
      databricks:
        endpoint: voice_asr_en_finetuned_whisper_lora
        # Fine-tuned Whisper endpoint is utterance-level, not streaming.
        mode: utterance
        postprocess_invoice_ids: false
        # Optional per-language endpoint routes for the UI interaction-language
        # dropdown. Keep business facts canonical (USD, INV-900xx) unless the data
        # model is explicitly localized later.
        routes:
          en-US:
            endpoint: voice_asr_en_finetuned_whisper_lora
          th-TH:
            endpoint: voice_asr_th_oss_pathumma_whisper_large_v3
          id-ID:
            endpoint: voice_asr_id_oss_qwen3_asr_0_6b
          zh-CN:
            endpoint: voice_asr_zh_oss_qwen3_asr_0_6b
          zh-CN-sensevoice:
            endpoint: voice_asr_zh_oss_sensevoice_small
          zh-CN-paraformer:
            endpoint: voice_asr_zh_oss_paraformer_8k
  tts:
    adapters:
      elevenlabs: "genie_voice.providers.tts.elevenlabs:ElevenLabsTTS"
      # deepgram_aura: "genie_voice.providers.tts.deepgram_aura:DeepgramAuraTTS"
      # azure:         "genie_voice.providers.tts.azure:AzureTTS"
    active: elevenlabs
    options:
      elevenlabs:
        model_id: eleven_turbo_v2_5
        voice_id: Rachel
        output_format: mp3_44100_128

# Mock generator behavior (dev only).
mock:
  interim_words_step: 2     # words added per interim event
  realtime_pacing: true     # sleep to emulate real-call timing
  inject_low_confidence: true
  channels:
    agent: 0
    customer: 1

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173

# Lakebase-first orchestration:
#   1. seed primary Lakebase serving tables
#   2. verify Lakebase CDF sync is running and lb_<table>_history exists in UC
#   3. refresh UC analytics from Lakebase CDF history + transcripts
#   4. reconcile Genie space
pipeline:
  autoloader_format: cloudFiles   # Auto Loader source for the streaming voice job
  source_format: json
  analytics_pipeline_name: "Genie Voice - UC Analytics Pipeline" # legacy cleanup name
  orchestration_job_name: "Genie Voice - Lakebase First Orchestration"
  # Workspace folder the deployer copies the job wheel + config into (serverless
  # installs from here). Empty -> /Users/<run_as>/genie_voice_pipeline.
  workspace_dir: ""
  environment_version: "3"   # serverless env version (Python + base libraries)

# Conversation intelligence (intent/sentiment/next-best-action/summary).
# The Databricks Foundation Model API is the SOLE engine: live agent-assist calls
# the serving endpoint per utterance; batch gold uses ai_query with structured
# (json_schema) output. No heuristic fallback - if the FM is unavailable the
# insight is reported as unavailable, not faked.
enrichment:
  model_endpoint: "databricks-claude-opus-4-8"   # any model serving endpoint
  max_tokens: 512
  # null = omit temperature. Claude Opus 4.x (a reasoning model) rejects it; set a
  # number (e.g. 0.0) only for endpoints that support it for deterministic output.
  temperature: null

# Enterprise dataset generation (quality + referential integrity for Genie).
datagen:
  seed: 42                  # deterministic / reproducible dataset
  num_agents: 6
  num_customers: 40
  num_calls: 60
  months_history: 4         # months of invoices per customer

# Credit-card issuer domain (voice-first "why" assistant). A SEPARATE dataset +
# Genie Agent that lives ALONGSIDE the contact-center demo above; the telco
# schema/space/volumes are left untouched. Reuses databricks.catalog +
# databricks.sql_warehouse_id; everything else is namespaced under its own schema.
card_issuer:
  enabled: true
  schema: genie_voice_card_issuer          # own UC schema inside databricks.catalog
  batch_volume: raw_batch_data             # reference files land here (in the card schema)
  reference_subdir: reference
  genie_space_name: "Genie Voice - Card Issuer"
  # Deterministic generation. population = random cardholders IN ADDITION to the
  # two hand-seeded, tie-out archetypes (CH-0001 Suneel = Statement Insights,
  # CH-0002 Maya = Rewards Optimizer).
  seed: 42
  population: 30

# Standalone realtime voice API (new API + new UI; independent of the sections
# above). STT/TTS are packaged as MLflow ResponsesAgent (Databricks Agent
# Framework, task = agent/v1/responses) and deployed as agent Model Serving
# endpoints; audio rides the Responses custom_inputs/custom_outputs channel.
# Catalog/schema/profile are inherited from the `databricks:` block above.
realtime_voice:
  # Middle stage of the voice loop: a Databricks foundation-model chat endpoint.
  # Benchmarked across en/th/id/zh (6 reps): Qwen3-Next 80B A3B is the fastest
  # option that also accepts `temperature` and `tools` -- ~1.17s median / 1.34s
  # p95 vs ~2.63s / 3.58s for claude-sonnet-5 (which rejects `temperature`).
  llm_endpoint: databricks-qwen3-next-80b-a3b-instruct
  # LLM sampling + tool-calling knobs for the middle stage.
  llm_defaults:
    temperature: 0.4
    max_tokens: 512
    # Enables the generic tool-calling loop (currently a get_current_time tool).
    tools_enabled: true
    max_tool_iterations: 3
  # TTS latency/quality knobs forwarded to the VoxCPM agent per request.
  # inference_timesteps was profiled across 4/6/8/10 on GPU_MEDIUM: latency is
  # flat across that range (~2.4-3.3s/sentence, rtf<1), but 4 steps degrades
  # Thai quality (STT-roundtrip similarity 0.76). 6 gives full similarity (1.0)
  # across en/th/id/zh at the lowest safe latency.
  tts_defaults:
    inference_timesteps: 6
    # cfg_value is VoxCPM's classifier-free guidance. 2.0 is the validated,
    # known-good value (shared with billing support). Lowering it to soften the
    # delivery also destabilizes VoxCPM and garbles the audio, so keep it at 2.0
    # and address voice "tone" via a pinned reference clip instead of this knob.
    cfg_value: 2.0
  # Turn-taking / VAD timing knobs (previously code-only defaults). These tune how
  # the server decides a caller's turn is over and when a talk-over counts as a
  # barge-in. All optional — omitting a key keeps the built-in default shown here.
  turn_taking:
    vad_silence_ms: 2500     # trailing silence to end a turn (energy-VAD fallback)
    max_turn_seconds: 20     # hard cap on a single turn's audio
    min_speech_ms: 400       # min voiced audio before a turn can finalize (echo filter)
    barge_in_ms: 700         # sustained talk-over needed to interrupt the reply
    sample_rate_hz: 16000    # default capture rate when the client doesn't specify
  # Operator-tunable serving/turn timeouts (deploy-varying: cold-start + endpoint
  # provisioning differ per workspace). Micro-timeouts (filler grace, cooldowns)
  # stay in code. All optional — omitting a key keeps the built-in default shown.
  timeouts:
    predict_s: 45            # synchronous STT/LLM predict request timeout
    tts_stream_s: 180        # streaming TTS read timeout (a full reply can run long)
    llm_turn_s: 50           # budget for one LLM turn (cold-start + tool rounds)
  # Async deep-dive (Genie Agent Mode) settings. `read_timeout_s` is the single
  # source of truth for BOTH the server SSE read timeout and the client stall
  # watchdog (the client waits this + a small buffer), so they can't disagree.
  # `summary_*` tune the short spoken "why" summarizer (factual → low temp, capped).
  deep_dive:
    read_timeout_s: 420
    summary_temperature: 0.3
    summary_max_tokens: 220
  # Semantic end-of-turn detection: a Silero VAD speech gate + the smart-turn v3
  # completeness model (bundled ONNX under realtime_api/models/, CPU-only). This
  # replaces the energy-RMS VAD, which held turns open on ambient noise and
  # mis-read long between-clause pauses (turns hit the 20s cap; the caller waited
  # seconds for a reply). Validated on real captured turns: real speech finalizes
  # ~0.3s after the caller stops (median ~9s saved vs the cap), 0 premature
  # cutoffs, and no-speech turns are discarded early. Falls back to the energy
  # VAD automatically if the models can't load. Languages outside smart-turn's
  # 23 (el/fil/ms/sv/th here) use Silero pause + vad_silence_ms.
  endpointing:
    enabled: true
    stop_ms: 300               # Silero pause that triggers a smart-turn check
    smart_turn_threshold: 0.5  # "utterance complete" probability
    noise_discard_seconds: 4   # no speech for this long -> drop the buffer as noise
  # Multilingual voice benchmark job targets this app's realtime WebSocket API and
  # writes scores to ``volume.multilingual_voice_benchmark_path``.
  benchmark:
    api_host: "https://genie-voice-agent-3644297589119053.aws.databricksapps.com"
    api_prefix: realtime  # mounted under /realtime on the Databricks app
  serving:
    workload_type: GPU_MEDIUM
    workload_size: Small
    scale_to_zero: false
    # Ephemeral scratch on the serverless registration job for HF snapshots
    # before they are uploaded into the UC model (not a persistent Volume).
    package_dir: /tmp/realtime_voice_packages
    # Serverless workspace dir where the launcher stages agent code for jobs.
    code_dir: ""   # empty -> /Users/<run_as>/realtime_voice_agents
  stt_candidates:
    qwen3_asr_1_7b_multilingual:
      status: candidate
      modality: stt
      endpoint: realtime_voice_stt_qwen3_asr_1_7b
      registered_model: realtime_voice_stt_qwen3_asr_1_7b
      family: qwen3_asr
      base_model: Qwen/Qwen3-ASR-1.7B
      wrapper_path: scripts/ml_asr/realtime_stt_agent.py
      wrapper_class: RealtimeSTTAgent
      # Qwen3-ASR-1.7B official language set (30), per the HF model card.
      supported_languages:
        [zh, en, yue, ar, de, fr, es, pt, id, it, ko, ru, th, vi, ja, tr, hi,
         ms, nl, sv, da, fi, pl, cs, fil, fa, el, hu, mk, ro]
      initial_validation_languages: [en-US, th-TH, id-ID, zh-CN]
  tts_candidates:
    voxcpm2_multilingual:
      status: candidate
      modality: tts
      endpoint: realtime_voice_tts_voxcpm2
      registered_model: realtime_voice_tts_voxcpm2
      family: voxcpm2
      base_model: openbmb/VoxCPM2
      wrapper_path: scripts/ml_asr/realtime_tts_agent.py
      wrapper_class: RealtimeTTSAgent
      # VoxCPM2 official language set (30), per the HF model card. Tagalog is
      # coded `fil` so it intersects Qwen3-ASR's Filipino tag.
      supported_languages:
        [ar, my, zh, da, nl, en, fi, fr, de, el, he, hi, id, it, ja, km, ko,
         lo, ms, "no", pl, pt, ru, es, sw, sv, fil, th, tr, vi]
      initial_validation_languages: [en-US, th-TH, id-ID, zh-CN]

# Vendor API keys for live STT/TTS (deployment: live).
# Set real values in gitignored config/config.local.yaml (overrides these).
# Environment variables (DEEPGRAM_API_KEY, etc.) override YAML when set.
secrets:
  deepgram_api_key: ""
  elevenlabs_api_key: ""

# Databricks Apps runtime config for the Genie Voice Agent.
#
# One web process: uvicorn serves the FastAPI API AND the built React SPA
# (api/app/static, produced by deploy_app.sh). The app authenticates to
# Databricks as its injected service principal: config.yaml sets
# auth_type=default, so the SDK unified-auth chain picks up the platform-injected
# DATABRICKS_CLIENT_ID/SECRET/HOST.
#
# User authorization (OBO): Genie / SQL workspace calls prefer the viewer's
# `x-forwarded-access-token` (fail-closed without it). Request these scopes in
# the App → Authorization UI (or via CLI) and restart so users re-consent:
#   - genie  — Genie Space Conversation + Agent Mode as the signed-in user
#   - sql    — warehouse reads when needed for query results
# Platform also injects default iam.current-user:read / iam.access-control:read.
# Local stand-in: set GENIE_OBO_LOCAL_TOKEN to a U2M/PAT token (see README).
#
# Notes:
#   - `command` is an array; env vars are NOT expanded except via a /bin/sh -c
#     wrapper. We also pin GENIE_CONFIG to an absolute path so the config loader
#     finds config/config.yaml regardless of the package install location, and
#     add api/ + repo root to PYTHONPATH so `app.main:app` and the mounted
#     `realtime_api` package both resolve from the source root.
#   - The app MUST listen on 0.0.0.0:$DATABRICKS_APP_PORT.
#   - Secret values (DEEPGRAM/ELEVENLABS keys, warehouse id) come from declared
#     app resources via `valueFrom` - never hardcode secrets here. deploy_app.sh
#     attaches these resources to the app.

# Requested user-authorization scopes (Apps OBO). app.yaml alone does not grant
# them: deploy_app.sh also applies them through the Apps control plane and fails
# the deploy unless `effective_user_api_scopes` contains both values.
user_api_scopes:
  - genie
  - sql

command:
  - "/bin/sh"
  - "-c"
  - 'export GENIE_CONFIG="$(pwd)/config/config.yaml"; PYTHONPATH="$(pwd)/api:$(pwd)/backend:$(pwd)" exec uvicorn app.main:app --host 0.0.0.0 --port $DATABRICKS_APP_PORT'

env:
  # ---------------------------------------------------------------------------
  # NO config values here. config/config.yaml is the single source of truth and
  # is synced to the app (deployment=live, auth_type=default, catalog, warehouse,
  # lakebase instance, providers, etc. all live there). GENIE_CONFIG (set in the
  # command above) points the loader at it.
  #
  # The ONLY env below is the vendor SECRET, which must never be committed to a
  # git-tracked config file. It is injected from a Databricks secret scope via a
  # declared app resource (see deploy_app.sh). Databricks Apps also inject the
  # service-principal OAuth creds (DATABRICKS_CLIENT_ID/SECRET/HOST) and
  # DATABRICKS_APP_PORT automatically - we do not set those.
  # ---------------------------------------------------------------------------
  - name: DEEPGRAM_API_KEY
    valueFrom: "deepgram-api-key"
  # ElevenLabs TTS is optional and not wired into the live flow; its key is empty
  # in config, so no secret/resource is created. To enable TTS later: store
  # elevenlabs_api_key in the secret scope, add an `elevenlabs-api-key` secret
  # resource to the app, and re-add:
  #   - name: ELEVENLABS_API_KEY
  #     valueFrom: "elevenlabs-api-key"
